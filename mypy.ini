[mypy]
python_version = 3.11
strict = True
mypy_path = stubs
explicit_package_bases = True
namespace_packages = True
ignore_missing_imports = True
show_error_codes = True
warn_unused_ignores = True

# SWIG-generated C++ extension wrapper and its low-level companion module are
# machine-generated ("Do not make changes to this file") and are rebuilt from
# the SWIG interface, so they are excluded from strict checking.
[mypy-osim_render._osim_render_native]
ignore_errors = True

[mypy-osim_render._osim_render]
ignore_errors = True

# VTK ships its Qt interactor as an untyped .py module; skip following it so
# QVTKRenderWindowInteractor is treated as Any rather than an untyped callable.
[mypy-vtkmodules.qt.*]
follow_imports = skip
